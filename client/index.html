<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Laser Ring: last one standing in a shrinking ring." />
    <meta name="theme-color" content="#15130f" />
    <title>Laser Ring</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>

    <main id="app">
      <!-- Menu: name, then create or join a room -->
      <section id="menu" class="panel screen">
        <h1 class="title">Laser Ring</h1>
        <p class="tagline">Walk the ring. Hold still. Fire on the reveal. Last one standing wins.</p>

        <label class="field">
          <span>Your name</span>
          <input id="name" maxlength="16" autocomplete="nickname" placeholder="Player" />
        </label>

        <div class="row">
          <button id="create" class="btn primary">Create room</button>
        </div>

        <div class="divider"><span>or join a room</span></div>

        <div class="row">
          <input id="code" maxlength="5" placeholder="ROOM CODE" autocomplete="off" class="code-input" />
          <button id="join" class="btn">Join</button>
        </div>

        <p id="menu-error" class="error" role="alert"></p>
      </section>

      <!-- Lobby: room code, players, host starts -->
      <section id="lobby" class="panel screen hidden">
        <p class="eyebrow">Room code</p>
        <button id="room-code" class="room-code" title="Copy room code"></button>
        <p class="hint">Share this code. Friends join from the menu.</p>

        <p id="lobby-result" class="result hidden"></p>

        <h2 class="section-title">Players <span id="player-count"></span></h2>
        <ul id="player-list" class="player-list"></ul>

        <div class="row">
          <button id="start" class="btn primary">Start match</button>
          <button id="leave" class="btn ghost">Leave</button>
        </div>
        <p id="lobby-note" class="hint"></p>
      </section>

      <!-- In-match HUD -->
      <section id="game" class="screen hidden">
        <canvas id="minimap" width="220" height="220" aria-label="Map of the ring"></canvas>
        <div class="stats">
          <div class="stat"><span id="alive-count">0</span> alive</div>
          <div class="stat">Ring <span id="ring-radius">--</span> m</div>
        </div>

        <div class="top-center">
          <p id="phase" class="phase"></p>
          <p id="timer" class="timer">--</p>
        </div>

        <div id="controls" class="panel controls hidden">
          <p id="controls-hint" class="hint"></p>
          <button id="lock" class="btn primary">Lock in</button>
        </div>

        <!-- Phone controls. The joysticks float to wherever a thumb lands, and the buttons stay in the corners. -->
        <div id="touch-ui" class="touch-ui hidden">
          <div id="zone-move" class="zone zone-left"></div>
          <div id="zone-look" class="zone zone-right"></div>
          <div id="stick-move" class="stick" aria-hidden="true"><div class="knob"></div></div>
          <div id="stick-look" class="stick" aria-hidden="true"><div class="knob"></div></div>
          <div class="pad pad-left">
            <button id="btn-forward" class="pad-btn" aria-label="Walk forward">▲</button>
            <button id="btn-back" class="pad-btn" aria-label="Walk back">▼</button>
          </div>
          <div class="pad pad-right">
            <button id="btn-turn-left" class="pad-btn" aria-label="Turn left">◀</button>
            <button id="btn-turn-right" class="pad-btn" aria-label="Turn right">▶</button>
          </div>
        </div>

        <p id="spectating" class="spectating hidden">You are out. Watching the last fight.</p>
      </section>

      <div id="rotate" class="rotate"><p>Turn your phone sideways to play</p></div>
      <button id="music-toggle" class="chip-button" aria-pressed="false">Music off</button>
      <div id="banner" class="banner" role="status" aria-live="polite"></div>
      <div id="toast" class="toast hidden" role="alert"></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
